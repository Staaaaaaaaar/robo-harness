# This file configures repository tooling. It does not make the monorepo a
# distributable Python package; each future ament_python package owns its own
# package metadata.

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rh_core", "rh_eval_simple_navigation", "rh_experiment", "rh_mock_agent", "rh_mock_env", "rh_pointnav", "rh_ros"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
